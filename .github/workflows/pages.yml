name: Deploy static 21cmFAST atlas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate visualization site
        run: |
          node --check app.js
          node --check i18n.js
          node --check lf-mass.js
          node --check portal/cavity.js
          node tests/test_lf_mass.cjs
          python - <<'PY'
          import json
          import pathlib

          for asset in (
              "robots.txt",
              "sitemap.xml",
              "llms.txt",
              "unified-shell.css",
              "index.html",
              "styles.css",
              "portal/cavity.html",
              "portal/cavity.css",
              "portal/cavity.js",
              "emulator/index.html",
              "emulator/styles.css",
          ):
              assert pathlib.Path(asset).is_file(), f"Missing {asset}"

          for fig in (
              "fig1_history_accuracy.webp",
              "fig3_ic_and_posterior_val.webp",
              "fig5_ps_estimator_and_fullbox.webp",
              "fig6_psx_independent_audit.webp",
              "fig7_tstar_local_correction.webp",
              "fig8_ard_gp_and_threeway_gmm.webp",
          ):
              assert pathlib.Path(f"emulator/figures/{fig}").is_file(), f"Missing figure {fig}"

          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          assert "unified-shell.css" in html
          assert "mcmc-section" not in html
          assert html.count('data-field="') == 5
          assert html.count('data-pl-field="') == 5

          index = json.loads(pathlib.Path("web_data/index.json").read_text(encoding="utf-8"))
          assert index["n_exact_runs"] == 55
          assert index["n_unique_pl_references"] == 32
          assert len(list(pathlib.Path("web_data/runs").glob("*.json"))) == 55
          assert len(list(pathlib.Path("web_data/pl").glob("pl_*.json"))) == 32
          PY

      - name: Assemble slim visualization-only site
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site/web_data"
          cp .nojekyll robots.txt sitemap.xml llms.txt index.html app.js i18n.js lf-mass.js styles.css unified-shell.css lf-mass-response.html lf-mass-response.js lf-mass-response.css lf-stellar-fraction.js "$RUNNER_TEMP/pages-site/"
          if [ -d fonts ]; then cp -R fonts "$RUNNER_TEMP/pages-site/"; fi
          cp -R portal emulator "$RUNNER_TEMP/pages-site/"
          cp web_data/index.json "$RUNNER_TEMP/pages-site/web_data/"
          cp -R web_data/runs web_data/pl "$RUNNER_TEMP/pages-site/web_data/"
          du -sh "$RUNNER_TEMP/pages-site"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
